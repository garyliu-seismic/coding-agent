[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A LangGraph-based CLI coding agent powered by DeepSeek (architecture analysis + code modification)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
include = ["coding_agent*"]
